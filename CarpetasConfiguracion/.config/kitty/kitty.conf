font_family      MesloLGS NF
bold_font        auto
italic_font      auto
bold_italic_font auto

foreground              #FFFFFF
background_opacity 0.60
dynamic_background_opacity yes
background_blur 8

selection_foreground    #09101C
selection_background    #FFFFFF
cursor                  #70BBD0
cursor_blink_internal 0
cursor_text_color       #100F0E

#active_tab_foreground     #09101C
#active_tab_background     #336787
#inactive_tab_foreground   #336787
#inactive_tab_background   #09101C

# black
color0      #293852
color8      #576C8F

# red
color1      #CCF4FF
color9      #AAE0F0

# green
color2      #CCE6FF
color10     #AACDF0

# yellow
color3      #CCECFF
color11     #AAD5F0

# blue
color4      #9AB6E6
color12     #9AB6E6

# magenta
color5      #9AC0E6
color13     #9AC0E6

# cyan
color6      #9AC9E6
color14     #9AC9E6

# white
color7      #CCF4FF
color15     #AAE0F0

# Tamaño del cursor
cursor_shape beam 
cursor_beam_thickness 1.8

#Detectar url 
detect_urls yes
url_color #0028B3

#Estilo de la barra al abrir otra ventana deltermianl
tab_bar_style powerline
# Color de las ventanas 
inactive_tab_background #D91C1C
inactive_tab_foreground #FFFFFF
active_tab_background #8DD91C
active_tab_foreground #000000
window_padding_width 8
confirm_os_window_close 0
cursor_blink_interval 0
enable_audio_bell no
visual_bell_duration 0


repaint_delay 8
input_delay 3

cursor_trail 3



